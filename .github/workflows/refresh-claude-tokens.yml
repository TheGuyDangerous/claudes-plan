name: Refresh Claude Tokens

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      account_id:
        description: 'Firestore account document id (under users/{owner_uid}/claude_accounts)'
        required: false
        type: string
      owner_uid:
        description: 'Firebase Auth UID of the account owner (required with account_id)'
        required: false
        type: string
      dispatch_secret:
        description: 'Shared secret required for manual app-triggered refreshes'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: refresh-claude-tokens-${{ github.event.inputs.owner_uid || 'all' }}-${{ github.event.inputs.account_id || 'all' }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate manual dispatch secret
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED: ${{ secrets.WORKFLOW_DISPATCH_SECRET }}
        run: |
          if [ "${{ github.event.inputs.dispatch_secret }}" != "$EXPECTED" ]; then
            echo "::error::Invalid dispatch_secret — refusing to run."
            exit 1
          fi

      - name: Checkout logic repository
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO_NAME }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: core

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: core
        run: npm ci

      - name: Refresh accounts
        working-directory: core
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          REFRESH_ACCOUNT_ID: ${{ github.event.inputs.account_id }}
          REFRESH_OWNER_UID: ${{ github.event.inputs.owner_uid }}
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.account_id != '' && 'true' || '' }}
        run: node scripts/refresh-accounts.mjs
